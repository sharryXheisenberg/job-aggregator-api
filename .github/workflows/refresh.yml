name: Refresh job postings

on:
  schedule:
    # Every 4 hours. Adjust to taste -- more frequent means fresher data
    # but more load on the free-tier source APIs and your Postgres.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you trigger a manual refresh from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python refresh.py
